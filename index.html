<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ecd8" id="themeColor" />
    <title>Pembaca Nyaman</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
(function(){
  var THEMES={light:'#ffffff',sepia:'#f4ecd8',warm:'#f0ece4',dark:'#1c1c1e'};
  var saved;
  try{var s=localStorage.getItem('pembaca-nyaman-settings');saved=s?JSON.parse(s).theme:null;}catch(e){}
  var theme=saved&&THEMES[saved]?saved:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'sepia');
  document.documentElement.setAttribute('data-theme',theme);
  var meta=document.getElementById('themeColor');
  if(meta)meta.setAttribute('content',THEMES[theme]||'#f4ecd8');
})();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
